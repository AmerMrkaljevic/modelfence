[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modelfence"
version = "0.1.0"
description = "Scan AI model files for code-execution payloads — including the evasions picklescan and ModelScan miss. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amer Mrkaljevic" }]
keywords = ["security", "machine-learning", "pickle", "pytorch", "safetensors",
            "gguf", "supply-chain", "malware-scanner", "mlsecops", "huggingface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AmerMrkaljevic/modelfence"
Issues = "https://github.com/AmerMrkaljevic/modelfence/issues"

[project.scripts]
modelfence = "modelfence.cli:main"

[tool.setuptools]
packages = ["modelfence"]
